<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>醫院交通到站時間</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8f5;
      --text: #1b1f1c;
      --muted: #5f6b61;
      --card: #ffffff;
      --border: #d8dfd6;
      --green: #16833a;
      --green-dark: #0f5f2a;
      --blue: #2264a8;
      --blue-dark: #16497b;
      --amber: #f3a712;
      --red: #c93a2f;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 24px 16px 32px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .refresh {
      appearance: none;
      border: 0;
      border-radius: 8px;
      padding: 12px 16px;
      background: var(--green);
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .refresh:active { background: var(--green-dark); }

    .refresh:disabled {
      cursor: wait;
      opacity: 0.7;
    }

    .meta {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.45;
    }

    .journey { margin-top: 22px; }
    .journey:first-of-type { margin-top: 0; }

    .journey h2 {
      margin: 0 0 12px;
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.15;
      letter-spacing: 0;
    }

    .routes {
      display: grid;
      gap: 16px;
    }

    .route {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 10px solid var(--green);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(28, 45, 34, 0.08);
    }

    .route.bus { border-left-color: var(--blue); }

    .route h3 {
      margin: 0 0 8px;
      font-size: clamp(23px, 4vw, 34px);
      line-height: 1.18;
      letter-spacing: 0;
    }

    .route .from {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 20px;
      line-height: 1.35;
    }

    .eta-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      min-height: 132px;
    }

    .eta {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 132px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px 12px;
      background: #fbfcfb;
      text-align: center;
    }

    .eta strong {
      display: block;
      font-size: clamp(34px, 8vw, 60px);
      line-height: 1;
      color: var(--green-dark);
      letter-spacing: 0;
    }

    .route.bus .eta strong { color: var(--blue-dark); }
    .eta span {
      margin-top: 8px;
      font-size: 19px;
      color: var(--muted);
    }

    .eta.now strong { color: var(--red); }
    .eta.scheduled strong { color: #87600b; }

    .notice {
      min-height: 28px;
      margin-top: 14px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.45;
    }

    .error {
      color: var(--red);
      font-weight: 700;
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    @media (max-width: 680px) {
      main { padding: 18px 12px 24px; }
      header {
        align-items: stretch;
        flex-direction: column;
      }
      .refresh {
        width: 100%;
        font-size: 20px;
        padding: 14px 16px;
      }
      .route { padding: 16px; }
      .eta-list {
        grid-template-columns: 1fr;
        min-height: 0;
      }
      .eta { min-height: 104px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>醫院交通到站時間</h1>
      <button class="refresh" type="button" id="refreshButton">立即更新</button>
    </header>

    <p class="meta" id="status">正在讀取最新到站時間...</p>

    <section class="journey" aria-labelledby="outboundTitle">
      <h2 id="outboundTitle">去程</h2>
      <div class="routes" aria-live="polite">
        <article class="route" data-route-key="toPwh505">
          <h3>505 小巴：去威爾斯親王醫院</h3>
          <p class="from">上車站：和滿街小巴總站 / 聯和墟方向</p>
          <div class="eta-list" id="toPwh505"></div>
          <p class="notice" id="toPwh505Notice"></p>
        </article>

        <article class="route bus" data-route-key="toShatinHospital84m">
          <h3>84M 九巴：威院去沙田醫院</h3>
          <p class="from">上車站：威爾斯親王醫院（ST860）</p>
          <div class="eta-list" id="toShatinHospital84m"></div>
          <p class="notice" id="toShatinHospital84mNotice"></p>
        </article>
      </div>
    </section>

    <section class="journey" aria-labelledby="returnTitle">
      <h2 id="returnTitle">回程</h2>
      <div class="routes" aria-live="polite">
        <article class="route bus" data-route-key="toPwh84m">
          <h3>84M 九巴：沙田醫院去威院</h3>
          <p class="from">上車站：沙田醫院（MA403）</p>
          <div class="eta-list" id="toPwh84m"></div>
          <p class="notice" id="toPwh84mNotice"></p>
        </article>

        <article class="route" data-route-key="toLuenWo505">
          <h3>505 小巴：去聯和墟 / 上水</h3>
          <p class="from">上車站：插桅杆街，近威爾斯親王醫院急症室</p>
          <div class="eta-list" id="toLuenWo505"></div>
          <p class="notice" id="toLuenWo505Notice"></p>
        </article>
      </div>
    </section>

    <footer>
      資料來源：香港政府資料一線通 / 運輸署公共小巴及九巴即時到站資料。頁面每 30 秒自動更新一次。
    </footer>
  </main>

  <script>
    const ROUTES = {
      toPwh505: {
        provider: "gmb",
        routeId: 2009147,
        routeSeq: 1,
        stopSeq: 5,
        targetId: "toPwh505",
        noticeId: "toPwh505Notice"
      },
      toShatinHospital84m: {
        provider: "kmb",
        route: "84M",
        stopId: "24E16716BBB7F2D0",
        serviceType: 3,
        targetId: "toShatinHospital84m",
        noticeId: "toShatinHospital84mNotice"
      },
      toPwh84m: {
        provider: "kmb",
        route: "84M",
        stopId: "A78292AA77A277A7",
        serviceType: 1,
        targetId: "toPwh84m",
        noticeId: "toPwh84mNotice"
      },
      toLuenWo505: {
        provider: "gmb",
        routeId: 2009147,
        routeSeq: 2,
        stopSeq: 3,
        targetId: "toLuenWo505",
        noticeId: "toLuenWo505Notice"
      }
    };

    const status = document.querySelector("#status");
    const refreshButton = document.querySelector("#refreshButton");
    const refreshIntervalSeconds = 30;
    let nextRefreshAt = 0;
    let isRefreshing = false;

    function gmbEndpoint({ routeId, routeSeq, stopSeq }) {
      return `https://data.etagmb.gov.hk/eta/route-stop/${routeId}/${routeSeq}/${stopSeq}`;
    }

    function kmbEndpoint({ stopId, route, serviceType }) {
      return `https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${serviceType}`;
    }

    function minutesUntil(timestamp) {
      if (!timestamp) return null;
      const diff = Math.ceil((new Date(timestamp).getTime() - Date.now()) / 60000);
      return Math.max(0, diff);
    }

    function normalizeGmbEta(item) {
      return {
        diff: item.diff,
        timestamp: item.timestamp,
        remark: item.remarks_tc || ""
      };
    }

    function normalizeKmbEta(item) {
      return {
        diff: minutesUntil(item.eta),
        timestamp: item.eta,
        remark: item.rmk_tc || ""
      };
    }

    function formatEta(item) {
      const isNow = item.diff <= 0;
      const remark = item.remark ? `（${item.remark}）` : "";
      return {
        label: isNow ? "即將到站" : `${item.diff} 分鐘`,
        subLabel: item.timestamp
          ? new Date(item.timestamp).toLocaleTimeString("zh-HK", {
              hour: "2-digit",
              minute: "2-digit"
            }) + remark
          : remark,
        className: `${isNow ? "now" : ""} ${item.remark ? "scheduled" : ""}`.trim()
      };
    }

    function renderEtas(config, etaItems) {
      const container = document.querySelector(`#${config.targetId}`);
      const notice = document.querySelector(`#${config.noticeId}`);
      const items = etaItems
        .filter((item) => item.timestamp)
        .sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp))
        .slice(0, 3);

      container.innerHTML = "";
      notice.textContent = "";
      notice.className = "notice";

      if (!items.length) {
        notice.textContent = "暫時沒有到站時間，請稍後再試。";
        notice.classList.add("error");
        return;
      }

      items.forEach((item) => {
        const eta = formatEta(item);
        const card = document.createElement("div");
        card.className = `eta ${eta.className}`;
        card.innerHTML = `<strong>${eta.label}</strong><span>${eta.subLabel}</span>`;
        container.appendChild(card);
      });
    }

    async function loadRoute(config) {
      const endpoint = config.provider === "kmb" ? kmbEndpoint(config) : gmbEndpoint(config);
      const response = await fetch(endpoint, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }
      const payload = await response.json();

      if (config.provider === "kmb") {
        return (payload.data || []).map(normalizeKmbEta);
      }

      if (!payload.data || payload.data.enabled === false) {
        return [];
      }
      return (payload.data.eta || []).map(normalizeGmbEta);
    }

    function updateStatus(message) {
      const now = Date.now();
      const secondsLeft = Math.max(0, Math.ceil((nextRefreshAt - now) / 1000));
      status.textContent = secondsLeft > 0
        ? `${message}｜${secondsLeft} 秒後自動更新`
        : message;
    }

    async function refresh() {
      if (isRefreshing) return;
      isRefreshing = true;
      refreshButton.disabled = true;
      status.classList.remove("error");
      status.textContent = "正在讀取最新到站時間...";

      try {
        await Promise.all(
          Object.values(ROUTES).map(async (route) => {
            const etaItems = await loadRoute(route);
            renderEtas(route, etaItems);
          })
        );

        const now = new Date().toLocaleTimeString("zh-HK", {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        });
        nextRefreshAt = Date.now() + refreshIntervalSeconds * 1000;
        updateStatus(`最後更新：${now}`);
      } catch (error) {
        nextRefreshAt = Date.now() + refreshIntervalSeconds * 1000;
        status.classList.add("error");
        updateStatus("未能讀取到站時間，請檢查網絡；系統會自動重試。");
      } finally {
        refreshButton.disabled = false;
        isRefreshing = false;
      }
    }

    refreshButton.addEventListener("click", refresh);
    refresh();
    setInterval(() => {
      if (Date.now() >= nextRefreshAt) refresh();
    }, 1000);
    setInterval(() => {
      if (!status.classList.contains("error") && nextRefreshAt > Date.now()) {
        const lastUpdatedText = status.textContent.split("｜")[0];
        updateStatus(lastUpdatedText);
      }
    }, 1000);
  </script>
</body>
</html>
